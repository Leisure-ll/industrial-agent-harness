name: Linux Chip installer acceptance

on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: chip-linux-installer-v0.1.0-preview.3

permissions:
  contents: read

jobs:
  native-installed-chip:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare protected Linux and engineering runtimes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bubblewrap curl autoconf flex bison help2man libfl-dev g++ make
          bwrap --unshare-user --unshare-pid --ro-bind / / --proc /proc --dev /dev -- /bin/true
          curl -fL --retry 3 https://github.com/verilator/verilator/archive/refs/tags/v5.026.tar.gz -o "$RUNNER_TEMP/verilator.tar.gz"
          printf '87fdecf3967007d9ee8c30191ff2476f2a33635d0e0c6e3dbf345cc2f0c50b78  %s\n' "$RUNNER_TEMP/verilator.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/verilator.tar.gz" -C "$RUNNER_TEMP"
          (
            cd "$RUNNER_TEMP/verilator-5.026"
            autoconf
            ./configure --prefix="$RUNNER_TEMP/verilator-runtime"
            make -j2
            make install
          ) > "$RUNNER_TEMP/verilator-build.log" 2>&1
          export PATH="$RUNNER_TEMP/verilator-runtime/bin:$PATH"
          printf '%s\n' "$RUNNER_TEMP/verilator-runtime/bin" >> "$GITHUB_PATH"
          verilator --version
          pnpm install --frozen-lockfile
          python -m pip install uv==0.11.6
          node apps/desktop/scripts/setup-kimi.cjs
          cd domain-packs/chip/eda-harness
          uv sync --frozen --no-dev --python 3.13
      - name: Install the previous public preview before upgrading
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prior-assets" "$RUNNER_TEMP/user-project" "$RUNNER_TEMP/user-config"
          cd "$RUNNER_TEMP/prior-assets"
          old_url='https://github.com/Zhiman-BJ/industrial-agent-harness/releases/download/chip-linux-installer-v0.1.0-preview.2'
          curl -fL --retry 3 "$old_url/industrial-harness-chip-linux-install.run" -o industrial-harness-chip-linux-install.run
          curl -fL --retry 3 "$old_url/industrial-harness-chip-linux-install.run.sha256" -o industrial-harness-chip-linux-install.run.sha256
          sha256sum -c industrial-harness-chip-linux-install.run.sha256
          bash industrial-harness-chip-linux-install.run --skip-image --prefix "$RUNNER_TEMP/prior chip" --bin-dir "$RUNNER_TEMP/chip-bin"
          printf 'preserve old install data\n' > "$RUNNER_TEMP/prior chip/user-data.keep"
          printf 'preserve project\n' > "$RUNNER_TEMP/user-project/design.keep"
          printf 'preserve model settings\n' > "$RUNNER_TEMP/user-config/model.keep"
          sha256sum "$RUNNER_TEMP/prior chip/install-receipt.json" "$RUNNER_TEMP/prior chip/user-data.keep" "$RUNNER_TEMP/user-project/design.keep" "$RUNNER_TEMP/user-config/model.keep" > "$RUNNER_TEMP/upgrade-preserved.sha256"
      - name: Native Agent, project discovery, real RTL and recovery
        shell: bash
        run: |
          set -euo pipefail
          export KIMI_EXECUTABLE="$GITHUB_WORKSPACE/apps/desktop/.venv-kimi/bin/kimi"
          pnpm run test:ci -- native-linux
          node --test tests/integration/linux-chip-bootstrap.test.cjs
      - name: Build clean immutable installer and verify actual installed consumer
        shell: bash
        run: |
          set -euo pipefail
          test -f "releases/$RELEASE_TAG.md"
          node scripts/package-headless.cjs --domain chip
          mkdir -p dist/linux-chip-release
          tar -czf dist/chip-cli.tar.gz -C dist headless-chip
          node scripts/package-linux-chip-installer.cjs dist/chip-cli.tar.gz dist/linux-chip-release/industrial-harness-chip-linux-install.run "$RELEASE_TAG" > dist/linux-chip-release/build-identity.json
          bash dist/linux-chip-release/industrial-harness-chip-linux-install.run --skip-image --prefix "$RUNNER_TEMP/installed chip" --bin-dir "$RUNNER_TEMP/chip-bin"
          sha256sum -c "$RUNNER_TEMP/upgrade-preserved.sha256"
          node - "$RUNNER_TEMP/prior chip" "$RUNNER_TEMP/installed chip" "$RUNNER_TEMP/chip-bin/industrial-harness-chip" <<'JS'
          const fs = require('node:fs');
          const [previous, current, launcher] = process.argv.slice(2);
          const oldReceipt = JSON.parse(fs.readFileSync(`${previous}/install-receipt.json`));
          const newReceipt = JSON.parse(fs.readFileSync(`${current}/install-receipt.json`));
          const entry = fs.readFileSync(launcher, 'utf8');
          // The fixture prefixes contain spaces, escaped by the Bash launcher.
          const quotedPath = value => value.replaceAll(' ', '\\ ');
          if (entry.includes(quotedPath(previous)) || !entry.includes(quotedPath(current))) throw Error('Upgrade did not switch the managed launcher.');
          fs.writeFileSync('dist/linux-chip-release/upgrade-verification.json', JSON.stringify({
            status: 'PASS', previousRelease: 'chip-linux-installer-v0.1.0-preview.2',
            previousPackage: oldReceipt.package, currentPackage: newReceipt.package,
            launcherSwitched: true, previousInstallRetained: true, projectAndConfigRetained: true,
          }, null, 2) + '\n');
          JS
          node scripts/smoke-linux-chip-install.cjs "$RUNNER_TEMP/installed chip" "$RUNNER_TEMP/chip-bin/industrial-harness-chip" dist/linux-chip-release/verification.json
          bash dist/linux-chip-release/industrial-harness-chip-linux-install.run --skip-image --prefix "$RUNNER_TEMP/installed chip" --bin-dir "$RUNNER_TEMP/chip-bin"
          cp "$RUNNER_TEMP/installed chip/install-receipt.json" dist/linux-chip-release/install-receipt.json
      - name: Verify installed host Docker execution alongside the protected Agent
        shell: bash
        run: |
          set -euo pipefail
          docker info
          mkdir -p "$RUNNER_TEMP/docker-rtl-context"
          cp -a "$RUNNER_TEMP/verilator-runtime" "$RUNNER_TEMP/docker-rtl-context/verilator"
          cat > "$RUNNER_TEMP/docker-rtl-context/Dockerfile" <<'DOCKER'
          FROM ubuntu:22.04
          RUN apt-get update && apt-get install -y --no-install-recommends g++ make perl ca-certificates && rm -rf /var/lib/apt/lists/*
          COPY verilator /opt/verilator
          ENV PATH="/opt/verilator/bin:${PATH}"
          DOCKER
          image="industrial-harness-ci-verilator:${GITHUB_SHA}"
          docker build -t "$image" "$RUNNER_TEMP/docker-rtl-context" > "$RUNNER_TEMP/docker-rtl-build.log" 2>&1
          docker run --rm "$image" verilator --version
          node - "$RUNNER_TEMP/installed chip/install-receipt.json" "$image" <<'JS'
          const fs = require('node:fs');
          const [file, image] = process.argv.slice(2);
          const receipt = JSON.parse(fs.readFileSync(file));
          receipt.image = image;
          fs.writeFileSync(file, JSON.stringify(receipt, null, 2) + '\n');
          JS
          node scripts/smoke-linux-chip-install.cjs "$RUNNER_TEMP/installed chip" "$RUNNER_TEMP/chip-bin/industrial-harness-chip" dist/linux-chip-release/docker-runtime-verification.json
          docker image inspect "$image" --format '{{.Id}}' > dist/linux-chip-release/docker-test-image-id.txt
          docker image rm "$image"
      - name: Retain installer and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-chip-installer
          path: |
            dist/linux-chip-release/
            dist/ci-reports/
          if-no-files-found: warn
          retention-days: 14
