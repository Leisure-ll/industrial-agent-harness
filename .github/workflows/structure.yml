name: Repository structure

on:
  workflow_call:

jobs:
  structure:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check scaffold
        run: |
          test -f README.md
          test -f README.zh-CN.md
          test -f AGENTS.md
          test -f pnpm-workspace.yaml
          test -f LICENSE
          test -f THIRD_PARTY_NOTICES.md
          for dir in apps/desktop packages/agent-kimi packages/contracts packages/domain-skills packages/domain-runtime packages/domain-mcp packages/pack-manager packages/viewer-core packages/viewer-builtin; do
            test -f "$dir/README.md"
            test -f "$dir/package.json"
          done
          test -f apps/desktop/viewer-host/README.md
          test -f doc/viewer-layer.md
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          npm install -g pnpm@11.1.3
          pnpm install --frozen-lockfile
      - name: Source formatting
        run: pnpm run format:check
      - name: Architecture boundaries
        run: pnpm test:architecture
      - name: Domain Pack release contents and compatibility
        run: pnpm run test:release
      - name: Prepare independent RTL benchmark verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Paired benchmark engineering smoke
        run: pnpm run test:ci -- benchmark
      - name: Build Desktop renderer
        run: pnpm --filter @industrial-agent-harness/desktop build
      - name: Native questions and compaction compatibility
        run: node --test tests/integration/agent-question-kimi.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify registered Domain MCP over real transport
        run: |
          python -m pip install uv==0.11.6
          cd domain-packs/chip/eda-harness
          uv sync --frozen --no-dev --python 3.13
          uv run --frozen python -m pytest -q
          cd ../../..
          cd domain-packs/pcb
          uv sync --frozen --no-dev --python 3.13
          cd ../..
          pnpm run test:ci -- transport
      - name: Retain verifier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-regression
          path: dist/ci-reports/
          if-no-files-found: warn
          retention-days: 14
