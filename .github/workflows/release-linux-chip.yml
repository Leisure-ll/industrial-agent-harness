name: Release Linux Chip installer

on:
  push:
    tags:
      - 'chip-linux-installer-v*'

permissions:
  contents: write

jobs:
  qualify:
    uses: ./.github/workflows/industrial-linux.yml
    with:
      release_tag: ${{ github.ref_name }}
  publish:
    needs: qualify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-chip-installer
          path: installer-assets
      - name: Publish verified immutable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" installer-assets/linux-chip-release/* \
            --verify-tag --prerelease \
            --title "Linux Chip CLI complete installer ${GITHUB_REF_NAME#chip-linux-installer-}" \
            --notes-file "releases/$GITHUB_REF_NAME.md"
