name: Industrial Core acceptance

on:
  workflow_call:

permissions:
  contents: read

jobs:
  native-vertical-slice:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      HARNESS_REQUIRE_CORE_NATIVE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned workspace dependencies
        run: |
          npm install -g pnpm@11.1.3
          pnpm install --frozen-lockfile
      - name: Prepare native engineering and agent runtimes
        run: |
          python -m pip install uv==0.11.6
          brew install verilator
          node apps/desktop/scripts/setup-kimi.cjs
          cd domain-packs/chip/eda-harness
          uv sync --frozen --no-dev --python 3.13
      - name: Prepare pinned official FreeCAD runtime
        run: node scripts/setup-freecad.cjs
      - name: Build independent CAD CLI for native execution
        run: node scripts/package-headless.cjs dist/freecad-cli --domain cad
      - name: Verify the real state, action, verification and recovery path
        shell: bash
        run: |
          export KIMI_EXECUTABLE="$GITHUB_WORKSPACE/apps/desktop/.venv-kimi/bin/kimi"
          export HARNESS_FREECAD_TEST_CLI="$GITHUB_WORKSPACE/dist/freecad-cli/industrial-harness.cjs"
          mkdir -p dist/ci-reports
          pnpm run test:ci -- native 2>&1 | tee dist/ci-reports/native.log
      - name: Verify real FreeCAD artifacts through the Desktop viewer
        shell: bash
        run: |
          pnpm --filter @industrial-agent-harness/desktop build
          export HARNESS_CAD_SELFTEST_OUTPUT="$GITHUB_WORKSPACE/dist/ci-reports/cad-viewer.png"
          pnpm --filter @industrial-agent-harness/desktop test:cad 2>&1 | tee dist/ci-reports/cad-viewer.log
      - name: Collect native FreeCAD startup diagnostics
        if: failure()
        run: |
          mkdir -p dist/ci-reports
          sw_vers > dist/ci-reports/macos.txt
          codesign --verify --strict --verbose=2 "$INDUSTRIAL_HARNESS_FREECAD_CMD" > dist/ci-reports/freecad-signature.txt 2>&1 || true
          log show --last 5m --style compact --predicate 'process == "amfid" OR process == "freecadcmd"' > dist/ci-reports/freecad-system.log 2>&1 || true
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -iname '*freecad*' -exec cp {} dist/ci-reports/ \; || true
      - name: Retain native regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: industrial-native-arm64-${{ matrix.os }}
          path: dist/ci-reports/
          if-no-files-found: warn
          retention-days: 14
