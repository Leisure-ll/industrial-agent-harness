name: Industrial Core acceptance

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: industrial-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-vertical-slice:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      HARNESS_REQUIRE_CORE_NATIVE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned workspace dependencies
        run: |
          npm install -g pnpm@11.1.3
          pnpm install --frozen-lockfile
      - name: Prepare native engineering and agent runtimes
        run: |
          python -m pip install uv==0.11.6
          brew install verilator
          node apps/desktop/scripts/setup-kimi.cjs
          cd domain-packs/chip/eda-harness
          uv sync --frozen --no-dev --python 3.13
      - name: Verify the real state, action, verification and recovery path
        run: |
          test -f tests/integration/industrial-core-vertical-slice.test.cjs
          test -f tests/integration/industrial-core-installed-pack.test.cjs
          pnpm run test:industrial-core
          node --test packages/agent-kimi/tests/process-sandbox.test.cjs packages/domain-runtime/tests/industrial-recovery.test.cjs tests/integration/license-materials.test.cjs tests/integration/domain-mcp-kimi.test.cjs tests/integration/external-mcp-kimi.test.cjs
